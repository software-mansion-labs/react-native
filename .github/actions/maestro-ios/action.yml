name: Maestro E2E iOS
description: Runs E2E Tests on iOS using Maestro against a remote simulator via sim-remote
inputs:
  app-path:
    required: true
    description: The path to the .app file
  app-id:
    required: true
    description: The id of the app to test
  maestro-flow:
    required: true
    description: the folder that contains the maestro tests
  flavor:
    required: true
    description: Whether we are building for Debug or Release
    default: Release
  working-directory:
    required: false
    default: '.'
    description: The directory from which metro should be started

runs:
  using: composite
  steps:
    - name: Installing Maestro
      shell: bash
      run: export MAESTRO_VERSION=2.6.1; curl -Ls "https://get.maestro.mobile.dev" | bash
    - name: Installing Maestro dependencies
      shell: bash
      # libplist-utils provides plistutil, which backs the sim-remote plutil
      # shim (Maestro pipes `simctl listapps` output through `plutil`).
      run: |
        sudo apt-get update
        sudo apt-get install -y libplist-utils
    - name: Install sim-remote
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) TARGET="x86_64-unknown-linux-gnu" ;;
          aarch64 | arm64) TARGET="aarch64-unknown-linux-gnu" ;;
          *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac
        mkdir -p "$HOME/.local/bin"
        curl -fL --retry 3 -o "$HOME/.local/bin/sim-remote" \
          "https://github.com/software-mansion/sim-remote-releases/releases/download/softu/sim-remote-${TARGET}"
        chmod +x "$HOME/.local/bin/sim-remote"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Acquire remote simulator
      shell: bash
      # Credentials come from the calling job's env:
      # SIM_ROUTER_URL, SIM_ROUTER_USERNAME, SIM_ROUTER_API_KEY.
      run: |
        # An unset SIM_ROUTER_URL secret arrives as an empty env var, which
        # would override the router URL baked into the binary — drop it.
        [ -n "${SIM_ROUTER_URL:-}" ] || unset SIM_ROUTER_URL
        sim-remote login --timeout 900
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'
    - name: Setup node.js
      uses: ./.github/actions/setup-node
    - name: Run yarn install
      uses: ./.github/actions/yarn-install
    - name: Start Metro in Debug
      shell: bash
      if: ${{ inputs.flavor == 'Debug' }}
      run: |
        # build codegen or we will see a redbox
        ./packages/react-native-codegen/scripts/oss/build.sh

        cd ${{ inputs.working-directory }}
        yarn start &
        sleep 5 # to give metro time to load
    - name: Run tests
      id: run-tests
      shell: bash
      run: |
        # Put the Maestro shims (xcrun, xcodebuild, plutil, ...) on PATH so
        # stock Maestro drives the remote simulator through sim-remote.
        eval "$(sim-remote install-shims)"

        # Avoid exit from the job if one of the command returns an error.
        # Maestro can fail in case of flakyness, we have some retry logic.
        set +e

        node .github/workflow-scripts/maestro-ios.js \
          "${{ inputs.app-path }}" \
          "${{ inputs.app-id }}" \
          "${{ inputs.maestro-flow }}" \
          "Hermes" \
          "${{ inputs.flavor }}" \
          "${{ inputs.working-directory }}"
    - name: Release remote simulator
      if: ${{ always() }}
      shell: bash
      run: sim-remote logout || true
    - name: Store video record
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: e2e_ios_${{ inputs.app-id }}_report_${{ inputs.flavor }}_NewArch
        overwrite: true
        path: |
          video_record_1.mov
          video_record_2.mov
          video_record_3.mov
          video_record_4.mov
          video_record_5.mov
          report.xml
    - name: Store Logs
      if: failure() && steps.run-tests.outcome == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: maestro-logs-${{ inputs.app-id }}-${{ inputs.flavor }}-NewArch
        overwrite: true
        path: /tmp/MaestroLogs
